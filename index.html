<!DOCTYPE html>
<html lang="en">
<head>

    <title>Whatsapp web clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="top-section">
        <i class="fa-solid fa-message"></i>
        <i class="fa-solid fa-phone" aria-label="Calls"></i>
        <!-- <svg class="status-icon" width="1.25em" height="1.25em" viewBox="0 0 24 24" role="img" aria-label="Status" xmlns="http://www.w3.org/2000/svg">

          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />
        </svg> -->
        <i class="fa-regular fa-circle"></i>
        <i class="fa-solid fa-bullhorn" aria-label="Channels"></i>
        <i class="fa-solid fa-users-line"></i>
        <hr class="sidebar-divider">
        <i class="fa-brands fa-meta" aria-label="Meta"></i>
      </div>
      <div class="bottom-section">
        <i class="fa-regular fa-images"></i>
        <i class="fa-regular fa-circle-user"></i>
      </div>
    </div>
  

   <div class="chatlist-section">

      <i class="fa-solid fa-ellipsis-vertical"></i>
      <i class="fa-solid fa-plus"></i>
    </div>
    <div class="second-section">

    <div class="third-section">

      <span>Unread</span>
      <span>Favourites</span>
      <span>Groups</span>
      <span>Communities</span>
